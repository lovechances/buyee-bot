scanner:
  discovery_interval_seconds: 180
  ending_interval_seconds: 45
  jitter_seconds: 30
  concurrency: 1
  query_gap_seconds: 20
  search_pages_per_query: 2
  # Page two is sampled for core broad/slow exploration, while lower-priority
  # aliases and urgent high-cadence marketplace slices stay shallow.
  search_pages_by_layer:
    broad: 1
    medium: 1
    surgical: 1
    market_structure: 1
  deep_broad_pages: 2
  search_pages_by_strategy:
    market_explore: 2
    market_price_band: 2
  listing_dedupe_hours: 6
  # Unchanged listings that already consumed Stage B yield to unseen cards.
  # Price/bid/buyout/maturity signature changes still re-enter immediately.
  fully_evaluated_dedupe_hours: 24
  query_layer_shares:
    broad: 0.35
    medium: 0.15
    surgical: 0.05
    market_structure: 0.45
  market_strategy_shares:
    market_buyout: 0.35
    market_ending: 0.25
    market_closing: 0.20
    market_price_band: 0.10
    market_explore: 0.10
  max_source_attempts: 3
  decision_logic_reconsideration_max_age_hours: 24
  decision_logic_reconsideration_max_per_hour: 2

marketplaces:
  buyee:
    base_url: "https://buyee.jp/jdirectitems/auction"
    rate_limit_per_minute: 30
  yahoo:
    ended_auction_base: "https://auctions.yahoo.co.jp"

pricing:
  fx_jpy_to_usd: 0.00675
  buyee_fee_percent: 0.11
  plan_fee_jpy: 350
  domestic_shipping_jpy: 800
  international_shipping_jpy: 1500
  packaging_jpy: 300
  insurance_percent: 0.02
  duty_percent: 0.08
  reserve_percent: 0.05
  resale_fee_percent: 0.13
  profit_floor_usd: 75
  min_profit_multiple: 1.5

alert:
  ending_threshold_minutes: 60
  auction_alert_max_remaining_hours: 12
  same_listing_cooldown_hours: 12
  material_price_drop_fraction: 0.15
  material_price_drop_min_jpy: 1000
  material_price_drop_absolute_jpy: 5000
  material_price_drop_absolute_min_fraction: 0.05
  archive_watch_min_heat: 70
  archive_directional_min_heat: 55
  archive_directional_min_score: 75
  # Above this landed cost, an unsupported grail needs a named collection plus
  # specific design evidence or an explicit iconic-piece signal; heat cannot bypass it.
  unverified_grail_high_ticket_usd: 300
  buyout_min_score: 78
  ending_min_score: 70
  grail_min_score: 82
  silver_min_score: 50
  ignore_max_score: 64
  min_expected_profit_usd: 75

intelligence:
  auto_promote: false
  daily_refresh_hours: 24

comps:
  cache_ttl_hours: 72
  minimum_heat_for_lookup: 40
  minimum_candidates_before_broadening: 5

detail:
  minimum_heat: 40
  cache_ttl_hours: 24

# Card-only inspection eligibility. These thresholds choose which listings earn
# a detail fetch; they do not alter valuation, final routing, or alert standards.
stage_a:
  archive_heat_threshold: 40
  minimum_brand_confidence: 0.95
  market_minimum_heat: 18
  silver_minimum_heat: 30
  unknown_absolute_buyout_max_jpy: 10000
  unknown_max_band_fraction: 0.40
  max_candidates_per_query: 6
  max_market_candidates_per_query: 3
  max_market_candidate_rate: 0.03
  path_caps:
    unknown_interesting: 1
    silver_jewelry: 2
  relationship_rank_adjustments:
    core: 12
    collaboration: -4
    diffusion: -12
    uncertain: -14
    homage_reference: -30
  low_priority_collaboration_adjustment: -8

directional_opportunity:
  minimum_score: 72
  exceptional_actionable_price_jpy: 10000
  exceptional_actionable_price_bonus: 24
  exceptional_actionable_minimum_score: 62
  exceptional_diffusion_minimum_score: 58
  exceptional_low_priority_collaboration_minimum_score: 48
  exceptional_landed_usd: 30
  max_landed_usd: 65
  favorable_condition_bonus: 6
  # Actual piece-matched Yahoo-ended transactions may support only a
  # directional Japan-market discount; they never become U.S. FMV.
  japan_market_max_fraction: 0.65
  japan_market_min_similarity: 0.80
  diffusion_minimum_score: 85
  low_priority_collaboration_minimum_score: 88

risk:
  max_auth_risk: "medium"

feeds:
  personal:
    min_score: 72
    allowed_risk: ["low", "medium"]
