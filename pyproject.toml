[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buyeeye"
version = "0.1.0"
description = "Archive-fashion Buyee/Yahoo sourcing intelligence daemon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pydantic>=2.7",
  "sqlmodel>=0.0.22",
  "PyYAML>=6.0",
  "rapidfuzz>=3.0",
  "Pillow>=10.4",
  "imagehash>=4.3",
  "playwright>=1.47",
  "pytest>=8.3",
  "ruff>=0.6"
]

[project.scripts]
buyeeye = "buyeeye.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
